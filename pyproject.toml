[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teva-delivery"
version = "0.1.0"
description = "Levin Teva warehouse fulfillment: one packing screen over Konimbo, Cargo and the label printer"
requires-python = ">=3.15"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=2.14,<3",
  "fastapi>=0.165,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.16,<3",
  "python-multipart>=0.0.34,<1",
  "sqlalchemy>=2.0.58,<2.2",
  "tzdata>=2026.6",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4,<3",
  "pytest>=9,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<1",
]

[project.scripts]
teva-delivery = "teva_delivery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic reads its script template and the migrations at run time.
"teva_delivery.persistence" = ["migrations/*.mako", "migrations/*.py", "migrations/versions/*.py"]

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["stt"]

[tool.ruff.lint]
select = [
  "ASYNC", # blocking calls in async code
  "B",     # likely bugs
  "BLE",   # blind except
  "C4",    # comprehensions
  "DTZ",   # naive datetimes
  "E",
  "F",
  "FURB",
  "G",     # logging format strings
  "I",     # import order
  "LOG",
  "PERF",
  "PIE",
  "PT",    # pytest style
  "RET",
  "RUF",
  "S",     # security (bandit)
  "SIM",
  "T20",   # stray print()
  "UP",
  "W",
]
# Several facts per assert read better than one test per fact. Hebrew text is the product.
ignore = ["PT018", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed fake secrets and start real subprocesses and servers.
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]
# Alembic revision files follow Alembic's own layout.
"src/teva_delivery/persistence/migrations/**" = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = "src"
exclude = ["^stt/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
  "postgres: needs a PostgreSQL server (TEVA_TEST_POSTGRES_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["teva_delivery"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
